# ======= Required by test KafkaProducer =======
general.kafka-topic=test-topic

# Make Spring create a KafkaTemplate without needing a live broker
spring.kafka.client-id=test
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSergitializer
spring.kafka.template.default-topic=${general.kafka-topic}

# Avoid admin trying to touch a cluster
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false

# ======= H2 + JPA for tests =======
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false