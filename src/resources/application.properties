# Use in-memory H2 so JPA can start cleanly
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep schema management simple for the scaffold
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Prevent Kafka from autoconfiguring when no broker is set during this test
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
org.springframework.boot.autoconfigure.kafka.KafkaStreamsAutoConfiguration
