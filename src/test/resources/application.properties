# H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Do not set spring.kafka.bootstrap-servers; embedded Kafka will supply it

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Force the REST controller to serve on the port the test hits
server.port=33400

# Kafka (already likely present, keep as-is if you have them)
general.kafka-topic=midas-transactions
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.jpmc.midascore.foundation
